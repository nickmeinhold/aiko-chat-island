# Aiko Chat Gateway — production compose.
#
# SELF-CONTAINED aiko mesh (islands prereq-0 decouple, design 02). The gateway no
# longer borrows the matrix bridge stack's broker — it runs its OWN aiko mesh
# (mosquitto + registrar + ChatServer) in this compose project, on this project's
# own default network. This is what makes the gateway portable: an island is this
# same compose on a different host + domain + JWT secret.
#
# Three non-obvious choices, all grounded on the live host (design 02, verified
# 2026-06-30) — NOT assumed:
#
#  1. MESH, NOT MATRIX. The gateway reads canonical CHANNEL topology from the aiko
#     ChatServer (`aiko-chat`) via an ECConsumer(channel_list) share, discovered
#     through the registrar. The matrix↔aiko BRIDGE is deliberately ABSENT here —
#     it only injects matrix-originated messages and is not a topology source, so
#     an independent island doesn't run it (Option A: matrix interop diverges).
#
#  2. STORE — DB_URL points at file-backed SQLite on a named volume (the #1281
#     single-home thesis; aiosqlite is a declared prod dep). config.py defaults to
#     file-backed SQLite too now, so dev matches prod; deploy pins the absolute
#     /data path here.
#
#  3. IMAGE — ONE image runs the whole island. The gateway image already bundles
#     aiko_services + aiko_chat, so it serves all three aiko roles by `command:`
#     override: the gateway (default entrypoint), the registrar (`aiko_registrar`),
#     and the ChatServer (`chat_start.sh`). It is published multi-arch (amd64 +
#     arm64) at ghcr.io/nickmeinhold/aiko-chat-island by CI on every push/tag, so a
#     new island just PULLS it — nothing to build on the host. Pin a version with
#     ISLAND_VERSION (default `edge`, which tracks main). To build from source
#     instead, overlay docker-compose.build.yml (see that file). The old
#     aiko-bridge image is gone: aiko-chat-bridge is the Matrix bridge, which an
#     island does not run.
#
# The gateway port publish binds 127.0.0.1 only — Caddy reverse-proxies
# localhost:8095 and terminates TLS. The broker publishes NO host port (internal
# to this project's network), so the anonymous mosquitto.conf is safe.

# Compose PROJECT name is pinned here (not derived from the host dir basename) so
# container/network/volume prefixes are stable no matter what the checkout is called.
# The DB lives on an EXTERNAL volume (aiko_data, below) so this name can change freely
# without ever reprojecting the store.
name: aiko

services:
  chat-island:
    # Published multi-arch by CI; pull, don't build (build-from-source overlay:
    # docker-compose.build.yml). ISLAND_VERSION pins the tag (default: edge=main).
    image: ghcr.io/nickmeinhold/aiko-chat-island:${ISLAND_VERSION:-edge}
    restart: always
    # Reachable by Caddy on the host loopback; never exposed off-host directly.
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      # Explicit prod declaration arms config.py's fail-closed JWT guard
      # (a weak/dev secret crashes the boot — see config.py).
      ENVIRONMENT: production
      # Compose-level fail-closed: refuse to even render without a JWT_SECRET in
      # the env (the deploy script writes it from SOPS). Belt-and-suspenders with
      # the app-level >=32-char guard.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (SOPS-managed, >=32 chars)}
      # File-backed SQLite on the persistent volume below (4 slashes = absolute
      # path /data/aiko.db). aiosqlite dialect ships in the image (prod dep).
      DB_URL: sqlite+aiosqlite:////data/aiko.db
      # aiko bus — OUR own broker, by service name on this project's network.
      AIKO_MQTT_HOST: mosquitto
      AIKO_MQTT_PORT: "1883"
      AIKO_NAMESPACE: aiko
      # --- social sign-in (#13). DISABLED by default 2026-07-11 (#1923): the app
      # dropped social (app-PR#69), so the gateway follows. Default OFF gates off
      # the /social* endpoints AND drops apple/google/github from /providers (all
      # behind this flag in auth.py). This CLOSES the tolerant-nonce replay path by
      # making it unreachable (supersedes #1755) — the code that IS that path is
      # only removed in Phase 2 (#1923), so this is a disable, not a delete.
      # Reversible: a host .env SOCIAL_SIGNIN_ENABLED=true re-enables it (client IDs
      # kept as public defaults for that path). Password login (/register,/login)
      # is unaffected — passkeys are the primary, not the sole, ingress.
      # *_CLIENT_IDS MUST be JSON arrays (pydantic json-decodes list fields).
      SOCIAL_SIGNIN_ENABLED: ${SOCIAL_SIGNIN_ENABLED:-false}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-["cc.imagineering.aikoChatApp"]}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-["588100172166-a0r6ipvpju5rd6fh8lv85qqohpdosp33.apps.googleusercontent.com","588100172166-23ppgk6jdb3et2ehc1qj584c6rgs0c9j.apps.googleusercontent.com","588100172166-bagrmvftp3fcer2j2lvnh33j65g58elk.apps.googleusercontent.com"]}
      # --- OAuth broker (#21). GITHUB_CLIENT_SECRET is a REAL secret — NOT baked
      # here; both live only in the host .env. Absent → broker provider not listed
      # (fail-closed), and the both-or-neither default keeps the XOR boot-guard happy.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # --- WebAuthn passkeys (#1471 / #29). The primary ingress now that social is
      # disabled (#1923). Default stays OFF (dark) at the TEMPLATE level on purpose:
      # advertising passkey requires THIS island to serve valid /.well-known
      # assetlinks.json + AASA for ITS rpId (#1911) — a per-island precondition. So
      # each ready island opts in via its host .env (PASSKEY_ENABLED=true) rather
      # than the template asserting that precondition for every future island (a
      # cloned island with unconfigured well-known files would otherwise advertise a
      # sign-in path that dies mid-ceremony). Public, not a secret.
      PASSKEY_ENABLED: ${PASSKEY_ENABLED:-false}
      # --- Handle-change cooldown (#2631). Min seconds between handle changes via
      # PATCH /v1/me; the default (30 days) is correct for every island, forwarded
      # so a host .env MAY tune it. Not host-dependent (unlike passkey origins), so
      # not on the required-forwarding tripwire — just kept live to avoid the inert-
      # var class (a Settings field silently not forwarded).
      HANDLE_CHANGE_COOLDOWN_SECONDS: ${HANDLE_CHANGE_COOLDOWN_SECONDS:-2592000}
      # --- ISLAND IDENTITY (the compose is the island template). Each island sets
      # these in its host .env; the defaults are island 1 (chat.imagineering.cc) so
      # an imagineering deploy with no overrides is unchanged. Island 2 (enspyr)
      # sets GATEWAY_BASE_URL/_ID/_DISPLAY_NAME + PASSKEY_RP_ID to its own domain.
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-https://chat.imagineering.cc}
      # ISLAND_* is canonical; GATEWAY_* is the legacy name a not-yet-cut-over box
      # still has in its .env. BOTH are forwarded during the window, and config.py's
      # _adopt_legacy_gateway_identity picks the canonical one only when it is
      # non-blank — because compose forwards an unset var as "", which would
      # otherwise shadow a live box's real identity. Drop the GATEWAY_* three once
      # every box is cut over (docs/island-vs-gateway.md).
      ISLAND_ID: ${ISLAND_ID:-}
      GATEWAY_ID: ${GATEWAY_ID:-}
      ISLAND_DISPLAY_NAME: ${ISLAND_DISPLAY_NAME:-}
      GATEWAY_DISPLAY_NAME: ${GATEWAY_DISPLAY_NAME:-}
      # --- LiveKit (video/audio). Operator-settable; forwarded so a host .env value
      # is NOT inert in the container (the PASSKEY_EXTRA_ORIGINS/ISLAND_SIGNING_SEED
      # incident class — cage-match #122 Carnot+Tesla+Wu 3-way HIGH). API_SECRET is a
      # REAL secret; when set in prod, config.py demands >=32 chars + GATEWAY_ID + wss.
      # Absent => video is disabled (endpoint 503), NOT a boot failure.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://livekit.imagineering.cc}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-600}
      # --- ISLAND SIGNING IDENTITY (crucible-09). The Ed25519 seed that signs the
      # self-manifest (island_identity.py) is the island's trust root. SECRET —
      # supplied via the host .env (SOPS in deploy), NEVER committed. Absent → the
      # container falls to config.py's _DEV_ISLAND_SEED, which _harden_for_production
      # REJECTS at boot in prod (fail-closed, like JWT_SECRET). WITHOUT this line the
      # host .env value was inert (the PASSKEY_EXTRA_ORIGINS / MODERATOR_USER_IDS
      # trap): the operator would set a real seed, compose would drop it, and a
      # signed-manifest image (>= #107) would crash-loop on the dev-seed guard.
      # Default is config.py's _DEV_ISLAND_SEED (a PUBLIC "DO-NOT-USE" constant, not
      # a secret) — chosen over an empty default on purpose: it makes this forward a
      # ZERO-REGRESSION SUPERSET. When unset the container sees exactly what it sees
      # today (the dev seed), so a prod boot without a real seed trips the FRIENDLY,
      # actionable guard ("still the dev default — supply a real ISLAND_SIGNING_SEED
      # via `python -c ...`") instead of a cryptic "must be unpadded base64url" from
      # an empty string (the decode at config.py runs UNCONDITIONALLY). The sync with
      # _DEV_ISLAND_SEED is enforced by tests/test_config.py invariant 7, not this
      # comment.
      #
      # NAMED TRADEOFF (2026-08-01, cage-match PR#110/Tesla): JWT_SECRET above uses
      # compose-time refuse (`:?`) because it is ALWAYS required; the signing seed
      # instead SOFT-defaults so the current pre-#107 image (0.2.4, no seed guard, no
      # /v1/island) keeps redeploying without a seed in the host .env. Cost: once a
      # signed-manifest image (>= #107) is live, a forgotten seed is a LATE app-boot
      # crash-loop, not an early `compose config` refuse like JWT. REMOVAL CONDITION:
      # when the crucible-09 A-phase deploys AND the seed is guaranteed in SOPS on both
      # boxes, flip this to `${ISLAND_SIGNING_SEED:?ISLAND_SIGNING_SEED required...}`
      # for JWT parity (fail at compose-time, not app boot). Tracked in task #26.
      ISLAND_SIGNING_SEED: ${ISLAND_SIGNING_SEED:-YWlrby1kZXYtaXNsYW5kLXNlZWQtRE8tTk9ULVVTRSE}
      # Signing key version carried in the manifest for the rotation lifecycle
      # (#1865). Bumped when the seed is rotated. Defaults to config's 1.
      ISLAND_KEY_VERSION: ${ISLAND_KEY_VERSION:-1}
      # Directory SEED peers (#1548) — operator-curated FULL peer entries, merged
      # with NO network fetch (authentic by construction). THIS is how islands list
      # each other today: JSON array of {"id","display_name","base_url"}. Island 1
      # seeds enspyr; island 2 seeds imagineering. Safe with gossip off.
      ISLAND_SEED_PEERS: ${ISLAND_SEED_PEERS:-[]}
      GATEWAY_SEED_PEERS: ${GATEWAY_SEED_PEERS:-[]}
      # Gossip FETCH gate — fail-closed. The anti-entropy loop pulls peer base URLs
      # (SSRF surface, #1578), so it stays OFF until that hardening lands AND 3+
      # islands make transitive discovery worth it. Off → directory still serves
      # self + seed peers, no fetch.
      GATEWAY_GOSSIP_ENABLED: ${GATEWAY_GOSSIP_ENABLED:-false}
      # Peer-gossip bootstrap (#1546). JSON array of peer base URLs to FETCH. Only
      # consulted when GATEWAY_GOSSIP_ENABLED is true; leave empty (seed peers are
      # the fetch-free path).
      GATEWAY_BOOTSTRAP_PEERS: ${GATEWAY_BOOTSTRAP_PEERS:-[]}
      # Passkey RP id is domain-scoped — must match the serving host.
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-chat.imagineering.cc}
      # Android Digital Asset Links (#1911) — Play App Signing + upload + debug
      # SHA-256 cert fingerprints, JSON array. PUBLIC (served verbatim at
      # /.well-known/assetlinks.json), not secrets — baked as the prod default
      # like the *_CLIENT_IDS above, so it can't drift/revert on redeploy. Same
      # app across both islands => same fingerprints. The Play App Signing cert
      # (first entry) is load-bearing: Google re-signs the AAB, so a real Play
      # install runs THAT key, not the upload key — a DAL listing only the upload
      # key passes a sideload test but fails every store install.
      PASSKEY_ANDROID_CERT_SHA256: ${PASSKEY_ANDROID_CERT_SHA256:-["E1:7F:8F:CB:2E:5C:6A:23:85:58:22:71:62:45:36:62:12:1D:B1:F9:D8:66:A1:B9:EC:44:C4:EC:91:60:8B:A0","8C:36:97:E6:F2:38:1D:86:0C:C6:B4:24:39:4B:46:79:22:BD:85:C4:E0:7A:E3:F9:D9:F1:84:41:AA:6D:48:E7","AF:FB:6C:CF:92:54:A7:44:6A:F2:A8:A8:10:B3:AB:EF:70:99:B7:42:1E:82:92:C7:CF:7B:30:E9:A2:3F:A7:70"]}
      # Android Credential Manager presents an `android:apk-key-hash:<b64url-sha256
      # -of-signing-cert>` origin at register/authenticate FINISH — NOT a web origin
      # (iOS sends https://<rp_id>, which _expected_origins derives for free). Without
      # the app's origin in the allow-list, py_webauthn REJECTS every Android
      # attestation ("attestation verification failed" -> 401) even after RP-ID/DAL
      # pass. Baked default = base64url of the SAME three cert fingerprints above
      # (upload + Play + debug), so it can't drift on redeploy and covers a sideload
      # build AND a Play install. Same app across both islands => same origins.
      # (Verified live 2026-07-28: Android passkey CREATE reached register/finish 200
      # only once this reached the container — the compose previously never forwarded
      # this var, so a host .env alone was inert.)
      PASSKEY_EXTRA_ORIGINS: ${PASSKEY_EXTRA_ORIGINS:-["android:apk-key-hash:4X-Pyy5caiOFWCJxYkU2YhIdsfnYZqG57ETE7JFgi6A","android:apk-key-hash:jDaX5vI4HYYMxrQkOUtGeSK9hcTgeuP52fGEQaptSOc","android:apk-key-hash:r_tsz5JUp0Rq8qioELOr73CZt0IegpLHz3sw6aI_p3A"]}
      # --- MODERATION (operator seat, #100). JSON array of user IDs granted the
      # moderator capability (take-down / dismiss / ban); config.py reads it into
      # settings.moderator_user_ids (fail-closed EMPTY — no moderators until set).
      # Baked default is [] so a stock island has no moderators; the operator
      # appoints them via a host .env MODERATOR_USER_IDS=["<uid>",...]. WITHOUT this
      # line the var was inert in the container even when set in the host .env — the
      # identical "compose never forwarded it" trap that made PASSKEY_EXTRA_ORIGINS
      # silently useless until 2026-07-28. Pydantic json-decodes the list field, so
      # the value MUST be a JSON array.
      MODERATOR_USER_IDS: ${MODERATOR_USER_IDS:-[]}
      # Operator alert webhook (#91): a URL the island POSTs to when a report is
      # filed. Optional (config default None → feature no-ops). Same inert-var trap
      # as MODERATOR_USER_IDS: a host .env value never reached the container without
      # this line. Empty default = unset = no webhook.
      MODERATION_ALERT_WEBHOOK_URL: ${MODERATION_ALERT_WEBHOOK_URL:-}
      # A5 (crucible-09): operator acknowledgement of the CSAM/illegal-content runbook.
      # In PRODUCTION, moderator mode (the default) refuses to boot until this is true
      # (config.py _harden_for_production). Baked default false so a stock island fails
      # closed; the operator flips it in the host .env once they've read the runbook.
      # Same inert-var trap as MODERATOR_USER_IDS — without this line a host .env value
      # never reaches the container and the crucible-09 image would crash-loop on the
      # A5 boot guard. Forwarded here AND asserted by test_config.py invariant 7.
      CSAM_RUNBOOK_ACKNOWLEDGED: ${CSAM_RUNBOOK_ACKNOWLEDGED:-false}
      # The channels this island bridges from the aiko bus (#2555). config default is
      # ["general"] (config.py:59); the operator widens it in the host .env. Powers the
      # app's app-bar channel switcher (aiko_chat_app PR#106), which only renders when
      # GET /v1/channels returns >1 channel. Same inert-var trap as MODERATOR_USER_IDS —
      # without this line a host .env AIKO_CHANNELS never reaches the container and the
      # switcher stays dormant on a single "general" channel. Pydantic json-decodes the
      # list[str] field, so the value MUST be a JSON array. Forwarded here AND asserted
      # by test_config.py invariant 7.
      AIKO_CHANNELS: ${AIKO_CHANNELS:-["general"]}
      # --- COMPLETENESS SWEEP (2026-08-22). Everything below was a Settings field
      # that docker-compose did not forward, so a host .env value was INERT — the
      # PASSKEY_EXTRA_ORIGINS / MODERATOR_USER_IDS / ISLAND_SIGNING_SEED class for the
      # FOURTH time, found by making invariant 7 TOTAL rather than curated. The
      # curated allowlist could only ever assert the vars someone remembered; 30 of 62
      # fields were unforwarded, including OPEN_REGISTRATION, RATE_LIMIT_ENABLED,
      # AUTH_RATE_LIMIT, MAX_REQUEST_BYTES and PASSKEY_REQUIRE_USER_VERIFICATION.
      #
      # EVERY default here MUST equal config.py's default for the same field, and
      # test_config.py asserts that field-by-field. A `${VAR:-}` under a field whose
      # config default is non-empty does not "fall back" — it SETS the container var
      # to the empty string and overrides the default, usually into a boot-time
      # pydantic error. The compose default is not documentation; it is the value.
      #
      # Neither live island sets any of these today (checked on both boxes before the
      # sweep), so this is behaviour-neutral on deploy — which is exactly why now was
      # the cheap moment to close the class.
      #
      # APNs push wake (#3267 inc 2). Absent/blank => push OFF, not a boot failure;
      # config.py refuses to boot on a HALF set. APNS_PRIVATE_KEY is a multi-line PEM:
      # verified 2026-08-22 that a quoted multi-line .env value survives compose
      # interpolation into the container with real newlines (docker compose v5.1.0).
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      # Sandbox vs production APNs host — an OPERATOR switch the code may not guess.
      # A development-build device token is valid ONLY against the sandbox host.
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-false}
      APNS_WAKE_PER_RECIPIENT_PER_MINUTE: ${APNS_WAKE_PER_RECIPIENT_PER_MINUTE:-6}
      # Auth/abuse policy — operator-tunable blast-radius caps (#28).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-65536}
      # Registration posture. The field is TRI-STATE in config.py (None = "resolve
      # from ENVIRONMENT": open in dev, closed in prod) but the compose default here
      # is the RESOLVED prod value, deliberately, and NOT blank.
      #
      # WHY NOT BLANK (cage-match PR#141, Carnot P1 — verified against the real
      # artifact, not reasoned about): a blank default is only safe if the RUNNING
      # IMAGE contains this branch's _blank_is_unspecified coercion. The islands run
      # pinned images, and the box's compose is not version-locked to them, so the new
      # compose can land on an older image. Running the actually-deployed
      # ghcr.io/nickmeinhold/aiko-chat-island:0.6.0 with OPEN_REGISTRATION="" returns
      # `bool_parsing` ValidationError — i.e. the island CRASH-LOOPS. The neutrality
      # proof that missed this constructed Settings from BRANCH source; the pinned
      # image is a third state distinct from both repo and runtime.
      #
      # `false` is safe on BOTH images and changes nothing: ENVIRONMENT is statically
      # production in this file, and prod resolves the tri-state to closed anyway. So
      # this states the value prod already had, and removes the version coupling
      # entirely rather than guarding it. `:-` (not `-`) so an operator's EMPTY .env
      # entry also lands here instead of reaching pydantic as "".
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}
      # Island posture (crucible-09) — moderator vs the other modes.
      ISLAND_MODE: ${ISLAND_MODE:-moderator}
      # Passkey per-island binding (Design 06) — the RP-side identity the handset
      # signs against. A wrong value here fails CREATE on the device, not at boot.
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-Aiko Chat}
      PASSKEY_IOS_APP_ID: ${PASSKEY_IOS_APP_ID:-SPL85G447K.cc.imagineering.aikoChatApp}
      PASSKEY_ANDROID_PACKAGE: ${PASSKEY_ANDROID_PACKAGE:-cc.imagineering.aiko_chat_app}
      PASSKEY_REQUIRE_USER_VERIFICATION: ${PASSKEY_REQUIRE_USER_VERIFICATION:-true}
      PASSKEY_CHALLENGE_TTL_SECONDS: ${PASSKEY_CHALLENGE_TTL_SECONDS:-300}
      # Session / OAuth / provisioning windows.
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
      OAUTH_HANDOFF_TTL_SECONDS: ${OAUTH_HANDOFF_TTL_SECONDS:-120}
      APP_OAUTH_CALLBACK_URL: ${APP_OAUTH_CALLBACK_URL:-aikochat://auth}
      PROVISIONING_TTL_SECONDS: ${PROVISIONING_TTL_SECONDS:-600}
      SOCIAL_NONCE_REQUIRED: ${SOCIAL_NONCE_REQUIRED:-false}
      SOCIAL_NONCE_TTL_SECONDS: ${SOCIAL_NONCE_TTL_SECONDS:-600}
      RECOVERY_VETO_WINDOW_SECONDS: ${RECOVERY_VETO_WINDOW_SECONDS:-259200}
      GATEWAY_GOSSIP_INTERVAL_SECONDS: ${GATEWAY_GOSSIP_INTERVAL_SECONDS:-300}
    volumes:
      # Persist the SQLite store across container recreates. External + stably named
      # so the store survives any project/service rename (see volumes: block).
      - aiko_data:/data
    depends_on:
      - chat

  # --- the gateway's OWN aiko mesh (design 02) -------------------------------
  # mosquitto (transport) + registrar (discovery) + ChatServer (channel/user
  # topology). No host ports; reachable only within this project's network.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  registrar:
    image: ghcr.io/nickmeinhold/aiko-chat-island:${ISLAND_VERSION:-edge}
    restart: always
    # The image bakes a gateway HEALTHCHECK (curl /health :8095). This role serves
    # no HTTP, so that check fails forever and shows "unhealthy". Disable it — the
    # role has no HTTP surface to probe; restart:always covers a crash.
    healthcheck:
      disable: true
    environment:
      AIKO_MQTT_HOST: mosquitto
      AIKO_NAMESPACE: aiko
    command: ["aiko_registrar"]
    depends_on:
      - mosquitto

  chat:
    image: ghcr.io/nickmeinhold/aiko-chat-island:${ISLAND_VERSION:-edge}
    restart: always
    # Same as registrar: this role serves no HTTP, so the image's baked gateway
    # HEALTHCHECK would fail forever. Disable it.
    healthcheck:
      disable: true
    environment:
      AIKO_MQTT_HOST: mosquitto
      AIKO_NAMESPACE: aiko
    # geekscape/aiko_chat bootstraps its HyperSpace (channels: general/llm/random/
    # robot/yolo) before `aiko_chat run`; chat_start.sh does that idempotently from
    # the _chat_server_ working dir it creates. Verified to reproduce the live
    # 5-channel set exactly (design 02 §5 — the cutover data-safety condition).
    command: ["bash", "-c", "cd /tmp && exec bash /opt/aiko_chat/src/aiko_chat/chat_start.sh"]
    depends_on:
      - registrar

volumes:
  # EXTERNAL + stably named: the store is decoupled from the compose project name, so
  # renaming the project never reprojects (and never silently empties) the live DB.
  # One-time prod cutover: `docker volume create aiko_data` then copy the old
  # aiko-chat-gateway_aiko_gateway_data into it (see deploy runbook).
  aiko_data:
    external: true
    name: aiko_data
  # Broker state is transport-only (rebuilt on reconnect); a plain managed volume.
  mosquitto_data:
