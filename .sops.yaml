# SOPS recipients for this repo's encrypted secrets.
#
# Public keys only — nothing here is secret, and that is the point: anyone can see
# WHO can decrypt, nobody can decrypt without a private half.
#
# TWO RECIPIENTS, WITH DELIBERATELY UNCORRELATED FAILURE MODES. A second recipient
# whose private half sits next to the first one is not redundancy — this laptop
# already holds three age identities in a single keys.txt, so naming a second one
# from that file would satisfy the letter of the requirement and none of its purpose.
#
#   operator-laptop  — daily use. An APPLE SECURE ENCLAVE key (age1se1…), Touch ID or
#                      passcode to use. The private half physically cannot leave the
#                      Mac's Secure Enclave: it is not exportable, not backed up, and
#                      not carried by Migration Assistant. That non-exfiltratable
#                      property is the whole reason a YubiKey was on the table, and the
#                      Secure Enclave already provides it for nothing.
#
#                      MEASURED 2026-09-06 before adopting it, because getsops/sops#1803
#                      reports `invalid type 'age1se'`: that issue is STALE. sops PR#1641
#                      added age-plugin-se support in v3.10.0, and on the 3.11.0 here an
#                      age1se recipient encrypts and decrypts correctly.
#
#                      THE COST, NAMED: this key is bound to THIS Mac. A new laptop means
#                      a new key and `sops updatekeys`, and it cannot be used from the
#                      island boxes or any other machine. That is acceptable only because
#                      decryption is control-side BY DESIGN (the boxes never hold a key).
#                      The day deploying from a second machine matters, a YubiKey
#                      (age1yubikey1…) is the portable version of the same property.
#
#                      THE TRAP, because the failure is silent: the on-disk identity file
#                      is only a HANDLE. It syncs to a new Mac perfectly happily and is
#                      INERT there — the file exists while the capability does not. Do
#                      not read its presence as proof the key survived a migration.
#
# HONEST SCOPE, narrowed after the PR#166 cage-match (Tesla). age is 1-OF-2, not a
# split key: EITHER recipient alone decrypts everything. So this is redundancy against
# LOSS, and it is NOT a threshold scheme — there is no "two people must agree" property
# here, and the paper copy is a second STORAGE LOCATION for the same principal, not a
# third recipient. Anyone holding the recovery key holds both islands, every historical
# commit, forever.
#
# And the recovery key HAS been on this networked machine: it was generated here, and
# used here to prove it can decrypt production config. That proof was worth having — an
# untested recovery key is the usual way recovery fails — but it consumed the property
# it demonstrated. Do not describe this key as "never on a machine"; describe it as
# "generated and verified on the operator laptop 2026-09-06, then stored offline".
#
#   recovery         — never used in normal operation. Generated on this laptop
#                      2026-09-06, used ONCE here to prove it decrypts production
#                      config, then stored offline: Bitwarden AND paper. One key, two
#                      retrieval paths that fail for unrelated reasons (a forgotten
#                      master password does not burn the paper; a house fire does not
#                      lock the vault). It is NOT written to the age keystore and is
#                      not used in normal operation — but see the honest-scope note
#                      above: it has touched this machine, and the docs must not claim
#                      otherwise.
#
# IF A YUBIKEY IS EVER ADDED: do not make it Bitwarden's second factor if it is also
# the SOPS primary. One token guarding both the encryption and the route to the
# recovery key means a single loss closes both doors.
#
# Adding or rotating a recipient is not a one-shot decision: `sops updatekeys` on
# each file re-encrypts to the current recipient list.

creation_rules:
  # `.env.sops`, NOT `.enc.env`. SOPS infers input type from the EXTENSION, so a
  # file ending in `.env` is parsed as dotenv — and these are binary-encrypted,
  # because a real-newline PEM is not legal dotenv. The consequence was not
  # cosmetic: `sops updatekeys` — the documented rotation path, and the way a
  # YubiKey would later be added — FAILED with `invalid dotenv input line: {`.
  # A filename that claims a format its content does not have is a lie the
  # tooling believes. Renaming makes the name honest, so no command depends on
  # anyone remembering `--input-type binary`. (Found by testing the documented
  # procedure rather than the code; two adversarial reviewers read right past it.)
  - path_regex: deploy/secrets/.*\.env\.sops$
    key_groups:
      - age:
          # operator-laptop — Apple Secure Enclave, Touch ID or passcode.
          # Identity handle: ~/.config/sops/age/se-identity.txt (a HANDLE, not the key)
          - age1se1qgw7n5ehtekw2h7lflepxgmc2xw5rvf5uam60w7dpe3zyse4yqvvuwwkagu
          # recovery (Bitwarden + paper; generated+verified here 2026-09-06, then offline)
          - age1vh4qyncy3cwv5pgtjlmqefsj2p487cgkatl47vn4e3m6yku2faeqjnq90e
