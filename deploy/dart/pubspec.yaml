name: island_deploy
description: >-
  Deploy tooling for aiko-chat-island. Some of it runs on the OPERATOR's machine
  and drives a box over ssh; `bin/island.dart` runs ON the box, but only as an
  executable CI compiled: ISL-0003 (amended 2026-10-25) keeps toolchains off the
  box, not executables.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
