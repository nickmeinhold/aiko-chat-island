name: island_deploy
description: >-
  Operator-side deploy tooling for aiko-chat-island. Runs on the OPERATOR's
  machine and drives a box over ssh; nothing here is installed on a sovereign
  island box (ISL-0003 rejects a toolchain there, which is precisely why this
  package may be Dart at all).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
