# HAProxy :443 SNI mux for TURN-over-TLS on enspyr (task #4, Shape C / external_tls).
#
# WHY: LiveKit advertises turns:turn.enspyr.co:443 (hardcoded, roommanager.go), but
# Caddy owns :443 for chat + LiveKit-WSS. This mux peels ONLY the turn SNI off :443,
# terminates its TLS here, and forwards PLAINTEXT to LiveKit (external_tls:true) — every
# other SNI is raw-passthrough to stock Caddy, untouched. Per LiveKit's own recommendation
# ("place a L4 load balancer in front ... set external_tls to true"). HAProxy owns the turn
# cert → Caddy's hot-reload + this proxy's hot-reload means NO LiveKit cert-restart / media
# bounce (the temper's F3 landmine is dissolved by external_tls).
#
# CERT: /etc/haproxy/certs/turn.enspyr.co.pem = fullchain + key concatenated. Caddy STILL
# issues/renews turn.enspyr.co (keep its site block or a tls-app cert directive — Tesla's
# "issuance dies when you unstub" finding); a renew hook rebuilds the .pem + `systemctl
# reload haproxy` (graceful, no dropped conns). HTTP-01 on :80 (untouched) is the renewal
# path since :443 is now HAProxy's (TLS-ALPN would hit HAProxy). Verify HTTP-01 is forced.

global
    maxconn 8192
    log /dev/log local0
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  1h        # long-lived WSS + TURN relay allocations
    timeout server  1h

# ---- public :443 front door — peek ClientHello SNI, route by it (no termination here) ----
frontend fe443
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend be_turn_tls if { req_ssl_sni -i turn.enspyr.co }
    default_backend be_caddy

# turn.enspyr.co → the internal TLS-terminating frontend
backend be_turn_tls
    server turnterm 127.0.0.1:8444

# everything else (chat.enspyr.co, livekit.enspyr.co) → RAW TLS passthrough to Caddy,
# which still terminates and manages those certs itself. Caddy is otherwise untouched
# except for moving its listener from :443 to 127.0.0.1:8443.
backend be_caddy
    server caddy 127.0.0.1:8443

# ---- internal: terminate turn TLS, forward PLAINTEXT to LiveKit (external_tls:true) ----
frontend fe_turn_terminate
    bind 127.0.0.1:8444 ssl crt /etc/haproxy/certs/turn.enspyr.co.pem
    default_backend be_livekit_plain

backend be_livekit_plain
    server livekit 127.0.0.1:5349    # LiveKit external_tls:true listens PLAINTEXT TURN here
