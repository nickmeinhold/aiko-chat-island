# HAProxy :443 SNI mux for TURN-over-TLS on enspyr (task #4, Shape C / external_tls).
#
# WHY: LiveKit advertises turns:turn.enspyr.co:443 (hardcoded, roommanager.go), but
# Caddy owns :443 for chat + LiveKit-WSS. This mux peels ONLY the turn SNI off :443,
# terminates its TLS here, and forwards PLAINTEXT to LiveKit (external_tls:true) — every
# other SNI is raw-passthrough to stock Caddy (moved to :8443, firewalled to loopback — NOT via a
# Caddy `bind 127.0.0.1`, which would also make :80 loopback and break HTTP-01), untouched. Per
# LiveKit's own recommendation ("place a L4 load balancer in front ... set external_tls
# to true"). HAProxy owns the turn cert → graceful `reload haproxy` on renew means NO
# LiveKit cert-restart / media bounce (the temper's F3 landmine is dissolved by external_tls).
#
# CERT: /etc/haproxy/certs/turn.enspyr.co.pem = fullchain + key concatenated, 0640 root:haproxy
# (the key crosses caddy's uid boundary into haproxy's — Tesla F8; haproxy-cert-sync.sh is the
# SOLE writer and locks the perms). Caddy STILL issues/renews turn.enspyr.co from a loopback-only
# site block with `disable_tlsalpn_challenge` so renewal is deterministically HTTP-01 on :80
# (TLS-ALPN on :443 would hit HAProxy — Tesla/Carnot fail-closed-ACME finding). The
# haproxy-cert-sync timer rebuilds the .pem from caddy's store on fingerprint change +
# `systemctl reload haproxy`. See RUNBOOK.md.
#
# DEPLOY: NOT a hand-run config. cutover.sh installs it as the LAST step of a fail-closed,
# 4-artifact (Caddyfile + livekit.yaml + HAProxy + firewall) sequenced cutover; rollback.sh
# reverses all four. Never bind :443 here by hand while Caddy still owns it (port clash).

global
    maxconn 8192
    log /dev/log local0
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # 30m inactivity (Kelvin/Tesla, now DATA-backed): the earlier 1h was a guess; the real live
    # traffic keeps connections active far more often than that — WebRTC STUN consent runs ~every
    # 5s on an active relay, TURN allocations refresh well inside RFC5766's 10-minute lifetime, and
    # LiveKit WSS pings are on the order of seconds. So 30m is ~3x the longest legit idle (the 10m
    # TURN refresh) — comfortably above any live-but-quiet session, while halving the window a
    # dead-idle connection can hold a slot toward maxconn (8192). The fe443 non-hello reject already
    # bounds UN-established slowloris; this bounds the established-then-idle case.
    timeout client  30m
    timeout server  30m

# ---- public :443 front door — peek ClientHello SNI, route by it (no termination here) ----
# NO per-IP conn-rate stick-table here (deliberately): this is a SHARED acceptor fronting chat +
# LiveKit-WSS + TURN, and a per-source connection cap would reject legit users behind a corporate
# NAT / campus / CGNAT egress across ALL of those services at once (Carnot P2). The slowloris
# surface the 1h timeouts open is instead bounded by the `tcp-request content reject` below —
# a client that never completes a ClientHello within inspect-delay is dropped, so it can't hold a
# slot for an hour. maxconn (global) caps total. If prod telemetry later shows real abuse, add a
# targeted stick-table with a production-derived threshold — not a blind one on the shared door.
frontend fe443
    bind :443
    tcp-request inspect-delay 5s
    # Accept only once a real TLS ClientHello has arrived; REJECT anything else after the
    # delay (non-TLS junk, a slow/dribbled hello, a scanner) instead of letting it fall
    # through into Caddy and sit on a slot (Tesla/Carnot no-SNI/non-hello harmonic).
    tcp-request content accept if { req_ssl_hello_type 1 }
    tcp-request content reject

    # turn.enspyr.co → internal TLS terminator. Everything else (incl. a valid no-SNI hello)
    # → raw passthrough to Caddy. no-SNI-to-Caddy is the DOCUMENTED default policy, not an
    # accident: Caddy answers/refuses on its own terms; no unmatched-SNI blackhole.
    use_backend be_turn_tls if { req_ssl_sni -i turn.enspyr.co }
    default_backend be_caddy

# turn.enspyr.co → the internal TLS-terminating frontend. `check` (TCP connect to :8444)
# marks the backend DOWN if fe_turn_terminate failed to bind (missing/malformed cert) —
# so a turn connection is refused fast, not forwarded into a dead terminator that accepts
# then dies mid-handshake (Carnot). cutover.sh also preflight-asserts :8444 is bound
# before binding :443.
backend be_turn_tls
    server turnterm 127.0.0.1:8444 check

# everything else (chat.enspyr.co, livekit.enspyr.co) → RAW TLS passthrough to Caddy, which
# terminates + manages those certs. Caddy is moved to :8443 (global `https_port 8443`, :8443
# firewalled to loopback) by cutover.sh.
#
# send-proxy-v2 (Carnot P1): without it Caddy — and the gateway app behind it — would see every
# client as 127.0.0.1 (HAProxy), silently defeating the gateway's per-IP auth rate limiter, X-
# Forwarded-For, and any IP-based control. The PROXY v2 header carries the real client address;
# Caddy's :8443 listener is configured (Caddyfile.mux) to read it. check-send-proxy makes the
# HEALTH CHECK send the header too — Caddy expects it on every :8443 connection, so a plain
# (headerless) check would be rejected and mark the backend down.
backend be_caddy
    server caddy 127.0.0.1:8443 check check-send-proxy send-proxy-v2

# ---- internal: terminate turn TLS, forward PLAINTEXT to LiveKit (external_tls:true) ----
frontend fe_turn_terminate
    bind 127.0.0.1:8444 ssl crt /etc/haproxy/certs/turn.enspyr.co.pem
    default_backend be_livekit_plain

backend be_livekit_plain
    # LiveKit external_tls:true listens PLAINTEXT TURN here. It binds *:5349, but cutover.sh
    # firewalls :5349/tcp to loopback FIRST (before the plaintext flip) so the plaintext
    # socket is never publicly reachable. `check` = TCP connect to confirm LiveKit is up.
    server livekit 127.0.0.1:5349 check
