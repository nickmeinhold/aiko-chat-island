include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The same rule as deploy/dart: a check result is a sealed type, and a switch
    # that forgets an outcome is the bug class an oracle must not have.
    non_exhaustive_switch_expression: error
    non_exhaustive_switch_statement: error
