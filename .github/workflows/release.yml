name: release

# Continuous DELIVERY of the official gateway image — NOT deployment.
#
# This publishes a versioned, multi-arch container image to GHCR. It never
# touches a prod host: islands are sovereign nodes and deploy by PULLING this
# image on their own schedule (`docker compose pull && up -d`). That's the whole
# point — CI holds an artifact, not prod credentials.
#
# ONE image runs the whole island. This image already bundles aiko_services +
# aiko_chat, so it serves every aiko role by `command:` override — the gateway
# (default), the registrar (`aiko_registrar`), and the ChatServer (`chat_start.sh`).
# The only other container an island runs is stock `eclipse-mosquitto`. (The
# island does NOT run the Matrix bridge; aiko-chat-bridge is unrelated to it.)
#
# Arch: both live islands are arm64 (aarch64) and third-party operators are often
# amd64, so we build BOTH natively (public repos get free arm64 hosted runners —
# no slow QEMU emulation of this crypto-heavy image). Built per-arch by digest,
# then stitched into one multi-arch tag in the `merge` job (the canonical docker
# buildx pattern).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR via the built-in GITHUB_TOKEN — no extra secret

env:
  IMAGE: ghcr.io/nickmeinhold/aiko-chat-island

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # free native arm64 for public repos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stamped here rather than in the Dockerfile: a RUN-time `date` would differ
      # per arch and make the two per-arch images gratuitously non-identical.
      - name: Stamp build time
        id: stamp
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build this arch and push it to GHCR addressed only by digest (no tag yet).
      # The merge job collects the per-arch digests into the human tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Build provenance baked into the image so the running island can name its
          # own code at /health (src/aiko_gateway/build_info.py). github.sha is the
          # merge/push commit these bytes were built from — the fact an auditor (or a
          # deploy) actually wants, and the one nothing served previously.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
            BUILT_AT=${{ steps.stamp.outputs.at }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    # Narrowed here rather than at workflow level: only this job mints an OIDC
    # identity, and `build` must not be able to. Job-level `permissions` REPLACES
    # the workflow-level block, so contents/packages are restated, not inherited.
    permissions:
      contents: read
      packages: write
      id-token: write      # the whole security mechanism: a short-lived identity
                           # issued to THIS workflow run, which signs the provenance.
                           # The key never exists anywhere a human can reach it.
      attestations: write  # file the resulting bundle against this repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the tag set from the ref:
      #   push to main -> :edge        (bleeding edge)
      #   tag vX.Y.Z   -> :X.Y.Z :X.Y :X and (auto) :latest
      #   any build    -> :sha-<short> (traceability / rollback anchor)
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          # latest tracks semver releases only (NOT main) — flavor default is fine.

      # Stitch the per-arch digests into ONE multi-arch image per tag.
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags \
            $(for d in *; do printf '%s@sha256:%s ' "$IMAGE" "$d"; done)

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE}:${DOCKER_METADATA_OUTPUT_VERSION}"

      # --- supply-chain provenance (#3973 layer 1) ---
      #
      # The island's whole posture is that it DECLINES TO KNOW: no operator registry,
      # no telemetry, no record of who talks to whom. Attestation is the same posture
      # pointed the other way — it asks nothing of operators and lets a stranger prove
      # something true about the bytes we publish. Visibility, not prevention: this
      # cannot stop a bad image being pushed, it makes a bad image permanently
      # distinguishable from one this workflow built.
      #
      # The subject is the INDEX digest, not the per-arch digests. `:X.Y.Z` resolves to
      # the manifest list, so that is what an operator's `docker compose pull` gets and
      # what `gh attestation verify` will look for. Attesting the per-arch digests
      # instead would be true, verifiable, and about an artifact nobody resolves to.
      - name: Resolve the published index digest
        id: index
        run: |
          digest=$(docker buildx imagetools inspect \
                     "${IMAGE}:${DOCKER_METADATA_OUTPUT_VERSION}" \
                     --format '{{.Manifest.Digest}}')
          # imagetools prints diagnostics on failure and still exits 0 in some paths,
          # so shape-check rather than trusting the exit code.
          case "$digest" in
            sha256:*) ;;
            *) echo "not a digest: '$digest'" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          # Also store the bundle as an OCI referrer, so the attestation travels with
          # the image. An operator who mirrors our image into their own registry — the
          # sovereign case this project exists for — keeps the evidence with the bytes
          # instead of depending on our GitHub account still being there.
          push-to-registry: true

      # The must-fail arm. Without this the workflow only proves the attest STEP ran,
      # which is exactly the "known, not failing" shape this layer exists to escape.
      # If the bundle is missing, unverifiable, or names a different subject, the
      # release goes red here rather than at some operator's `verify` months later.
      - name: Verify the attestation we just published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "oci://${IMAGE}@${{ steps.index.outputs.digest }}" \
            --repo "${{ github.repository }}"

  # --- publish the GitHub Release the update nudge reads -----------------------
  #
  # MEASURED 2026-09-06, and it was a live dark capability: this repo had ZERO GitHub
  # Releases, so `/releases/latest` returned 404. `domain/update_nudge.py` reads exactly
  # that endpoint and fails OPEN at debug level, so the nudge shipped enabled by default
  # and would have stayed silent forever — indistinguishable, to an operator, from "you
  # are up to date". The image existed; the thing that tells anyone the image exists did
  # not. docs/standup-guide.md also tells operators to watch the releases page.
  #
  # So the Release is not release ceremony, it is the nudge's DATA SOURCE, and a data
  # source created by remembering to type `gh release create` is a hand-managed artifact
  # with no declared desired state. This job declares it.
  publish-release:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release object
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # annotated tag objects are not fetched at depth 1

      # The annotated tag message IS the release notes. One source, written at tag time
      # by the person who knows why the release exists — not regenerated from commit
      # subjects, which would drift from what the tagger meant.
      # Written to a FILE and passed as --notes-file, never interpolated into a command
      # line. A tag message is prose: it contains backticks, quotes and $ signs, and
      # `--notes "${{ ... }}"` would hand them to a shell. (Learned the same hour, the
      # hard way, by letting a backtick in a `git tag -m` string execute.)
      - name: Extract notes from the annotated tag
        run: |
          tag="${GITHUB_REF_NAME}"
          type=$(git cat-file -t "$tag")
          [ "$type" = tag ] || {
            echo "::error::$tag is a $type, not an annotated tag — it carries no notes" >&2
            exit 1
          }
          git tag -l --format='%(contents)' "$tag" > /tmp/release-notes.md
          [ -s /tmp/release-notes.md ] || {
            echo "::error::annotated tag $tag has an empty message" >&2
            exit 1
          }
          echo "--- notes to be published ---"; cat /tmp/release-notes.md

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      # MUST-FAIL ARM. Without this the job proves only that `gh release create` exited
      # 0; this asserts the endpoint the nudge actually reads now answers with THIS tag.
      # It is the difference between publishing a release and being discoverable.
      - name: Verify /releases/latest now names this tag
        run: |
          latest=$(curl -sf \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r .tag_name)
          echo "releases/latest = $latest (expected ${GITHUB_REF_NAME})"
          [ "$latest" = "${GITHUB_REF_NAME}" ] || {
            echo "::error::the update nudge would not see this release" >&2
            exit 1
          }
