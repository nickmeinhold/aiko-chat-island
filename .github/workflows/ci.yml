name: CI

# Minimal CI floor for aiko-chat-island (task #22). Runs the pytest suite on
# every PR and on push to main.
#
# The suite is deliberately isolated from aiko_services / aiko_chat (those install
# editable from local checkouts and are NOT declared deps): the test-reachable
# modules (db, domain.models, domain.messages_service, realtime.{ws,hub,envelopes})
# import only stdlib + sqlalchemy + the stdlib-only aiko.payload codec — never
# aiko_services. So `pip install -e ".[dev]"` on a clean checkout is sufficient.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # requires-python = >=3.12,<3.13 (aiko_services 0.6 cap)

      - run: pip install -e ".[dev]"

      - run: pytest

  # Stage 1 of #4824 put operator-side deploy tooling in Dart, and pytest cannot
  # see any of it. Without this job the Dart half is untested on CI while the
  # Python half is gated — which breaks the reason CI exists here at all
  # (decided 2026-09-01: "this repo is meant to have outside contributors, so CI
  # is what makes a stranger's PR safe to merge"). A second language is a second
  # gate, not a second opinion.
  #
  # `dart analyze --fatal-infos` rather than plain analyze: analysis_options.yaml
  # raises a non-exhaustive switch to an ERROR because the sealed outcome type is
  # the whole argument for the rewrite, and a gate that lets warnings through
  # would not enforce the property the code was written to have.
  deploy-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0' # pinned: pubspec says ^3.13.0, and "latest stable" is a
                        # moving gate that can go red on a day nobody touched it
      - run: dart pub get
        working-directory: deploy/dart
      - run: dart analyze --fatal-infos
        working-directory: deploy/dart
      - run: dart test
        working-directory: deploy/dart
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: deploy/dart

  # Key-free verification of the committed encrypted island config. Runs on every push
  # because the artifacts sit in a PUBLIC repo permanently: a dropped recipient or an
  # added one is invisible in a binary diff, and a plaintext slip cannot be un-pushed.
  # Every arm is mutation-proven (see deploy/secrets/README.md); it needs no secrets, no
  # key, and no network.
  secrets-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sops (for the rotation-path check)
        run: |
          # Checksum-pinned. An unverified curl makes the VERIFIER itself
          # supply-chain mutable — a thermometer the heat bath can rewrite
          # (Carnot, cage-match round 2). CI holds no decryption key, so the
          # secret blast radius is nil, but a tampered sops could report a
          # green gate over a broken artifact.
          SOPS_SHA=775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef
          curl -sSfL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          echo "$SOPS_SHA  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0' # pinned; see the deploy-dart job for why
      - run: dart pub get
        working-directory: deploy/dart
      - name: Verify committed secrets
        # DART, not deploy/verify-secrets.sh (#4824 Stage 1). This is the ONE
        # script under deploy/ that does not run on a sovereign box, so ISL-0003's
        # no-toolchain argument does not reach it.
        #
        # It adds a third outcome the shell could not express: exit 2, DID NOT
        # VERIFY, when fewer checks ran than the tree's contents require. Every
        # silence bug in verify-secrets.sh's history — a rename making the glob
        # match nothing, a PR deleting every secrets file, a tool dying mid-pipe —
        # produced "no failures found" over an empty set and exited 0.
        run: dart run deploy/dart/bin/verify_secrets.dart
